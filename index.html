<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05060f" />
<title>AI WEEK 2026 Live Agenda</title>
<link rel="preconnect" href="https://cdn-assets.inwink.com" />
<style>
  :root{
    --bg:#05060f; --bg2:#0b0d1c; --card:#11142a; --card2:#161a36;
    --line:#23284a; --txt:#eef0ff; --mut:#9aa0c8; --dim:#6b7099;
    --acc:#7c5cff; --acc2:#16e0c4; --live:#ff3b6b; --soon:#ffb020;
    --r:18px; --maxw:780px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding-bottom:92px;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--acc);color:#fff}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 14px}

  header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--bg) 60%,rgba(5,6,15,.86));backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .hrow{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
  .brand{font-weight:800;font-size:18px;letter-spacing:.3px;flex:1}
  .brand b{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:999px;white-space:nowrap}
  .clock.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:10px}
  .search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:15px}
  .search input::placeholder{color:var(--dim)}
  .search .clr{color:var(--dim);font-size:18px;padding:0 2px;cursor:pointer;display:none}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;background:var(--card);border:1px solid var(--line);color:var(--mut);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .chip.day.on{background:linear-gradient(90deg,var(--acc),var(--acc2));border-color:transparent}
  .chip.flt.has{border-color:var(--acc);color:var(--txt)}
  .chip.flt .badge{background:var(--acc);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;font-weight:800}

  .sec{margin:18px 0 6px;display:flex;align-items:center;gap:9px}
  .sec h2{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut)}
  .sec .dot{width:8px;height:8px;border-radius:50%}
  .sec .cnt{margin-left:auto;font-size:12px;color:var(--dim);font-weight:600}
  .dot.l{background:var(--live);box-shadow:0 0 0 4px rgba(255,59,107,.18);animation:pulse 1.6s infinite}
  .dot.s{background:var(--soon)}
  .dot.u{background:var(--acc)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:11px;position:relative;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .15s}
  .card:active{transform:scale(.985)}
  .card.live{border-color:rgba(255,59,107,.5);background:linear-gradient(180deg,rgba(255,59,107,.07),var(--card))}
  .card.soon{border-color:rgba(255,176,32,.35)}
  .ctop{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
  .time{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;white-space:nowrap}
  .time .end{color:var(--dim);font-weight:600;font-size:13px}
  .badgep{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .badgep.live{background:var(--live);color:#fff}
  .badgep.soon{background:var(--soon);color:#1a1300}
  .ml{margin-left:auto}
  .room{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;color:var(--acc2);margin-bottom:8px}
  .room svg{flex-shrink:0}
  .ttl{font-size:16px;font-weight:700;line-height:1.32;margin-bottom:11px}
  .spk{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
  .spk .av{display:flex;align-items:center;gap:7px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 3px;font-size:12px;font-weight:600;max-width:100%}
  .av img,.av .ph{width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
  .av span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .av .co{color:var(--dim);font-weight:500}
  .thm{position:absolute;top:0;right:0;width:4px;height:100%}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.3px;background:#7c5cff22;color:#b3a5ff}
  .prog{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--live),var(--soon));border-radius:99px}
  .prog-l{font-size:11px;color:var(--mut);margin-top:5px;font-weight:600}
  .empty{text-align:center;color:var(--dim);padding:34px 16px;font-size:14px;line-height:1.6}

  .splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:16px}
  .splash .lg{font-size:26px;font-weight:800}
  .splash .lg b{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* Ask-AI hero */
  .askhero{margin:16px 0 4px;background:linear-gradient(120deg,#1a1140,#0e2240);border:1px solid #34306b;border-radius:var(--r);padding:18px;position:relative;overflow:hidden;cursor:pointer}
  .askhero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;background:radial-gradient(circle,rgba(124,92,255,.45),transparent 70%)}
  .askhero h3{font-size:18px;font-weight:800;margin-bottom:5px}
  .askhero p{color:var(--mut);font-size:13px;line-height:1.5;max-width:80%}
  .askhero .go{display:inline-flex;align-items:center;gap:7px;margin-top:14px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;font-weight:800;font-size:14px;padding:11px 18px;border-radius:999px;cursor:pointer}
  .askhero .qask{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1}
  .askhero .qask input{flex:1;min-width:0;background:rgba(5,6,15,.55);border:1px solid #3a3570;border-radius:12px;color:var(--txt);font-size:13.5px;padding:12px 13px;outline:none}
  .askhero .qask input::placeholder{color:#8b8fc0}
  .askhero .qask button{flex-shrink:0;background:var(--card2);border:1px solid #3a3570;color:#fff;font-weight:800;font-size:13px;padding:0 16px;border-radius:12px;cursor:pointer}
  .askhero .qhint{color:#8b8fc0;font-size:11.5px;margin-top:10px;line-height:1.5;position:relative;z-index:1}

  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:100;opacity:0;pointer-events:none;transition:.22s}
  .ov.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--line);max-height:92vh;overflow-y:auto;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:var(--maxw);margin:0 auto}
  .sheet.on{transform:translateY(0)}
  .grip{width:38px;height:4px;background:var(--line);border-radius:99px;margin:10px auto 4px}
  .sbody{padding:6px 18px calc(28px + env(safe-area-inset-bottom))}
  .sbody h3{font-size:21px;line-height:1.3;margin:8px 0 6px;font-weight:800}
  .smeta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
  .smeta .m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;display:flex;gap:7px;align-items:center}
  .smeta .m b{color:var(--acc2)}
  .sdesc{color:var(--mut);font-size:14.5px;line-height:1.65;white-space:pre-line;margin-bottom:18px}
  .shead{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin:18px 0 10px}
  .sp{display:flex;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:9px}
  .sp img,.sp .ph{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  .sp .nm{font-weight:700;font-size:15px}
  .sp .jt{color:var(--mut);font-size:13px;margin-top:2px}
  .sp .bio{color:var(--dim);font-size:12.5px;line-height:1.55;margin-top:7px}
  .sp .li{display:inline-flex;align-items:center;gap:5px;color:var(--acc2);font-size:12px;font-weight:700;margin-top:8px}
  .fopt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .fopt .o{border:1px solid var(--line);background:var(--card);color:var(--mut);padding:9px 13px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
  .fopt .o.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .fbtn{position:sticky;bottom:0;display:flex;gap:10px;padding:14px 0 0;background:var(--bg2)}
  .fbtn button{flex:1;padding:14px;border-radius:12px;border:0;font-size:15px;font-weight:800;cursor:pointer}
  .fbtn .clr{background:var(--card);color:var(--mut);border:1px solid var(--line)}
  .fbtn .ok{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff}
  .actrow{display:flex;gap:9px;flex-wrap:wrap;margin:4px 0 16px}
  .actrow button{flex:1;min-width:130px;padding:12px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--txt);display:flex;align-items:center;justify-content:center;gap:7px}
  .actrow button.star.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .actrow button.cal{background:linear-gradient(90deg,#1d8f6a,#16e0c4);border:0;color:#04231b}

  /* Wizard */
  .wz .step{display:none}
  .wz .step.on{display:block;animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .wzq{font-size:19px;font-weight:800;margin:6px 0 4px}
  .wzs{color:var(--mut);font-size:13.5px;margin-bottom:16px;line-height:1.5}
  .wz textarea,.wz input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-size:15px;padding:13px;font-family:inherit;resize:vertical}
  .wz textarea:focus,.wz input:focus{outline:0;border-color:var(--acc)}
  .wzprog{display:flex;gap:5px;margin:2px 0 18px}
  .wzprog i{flex:1;height:4px;border-radius:9px;background:var(--line)}
  .wzprog i.on{background:linear-gradient(90deg,var(--acc),var(--acc2))}
  .wznav{display:flex;gap:10px;margin-top:22px}
  .wznav button{flex:1;padding:14px;border-radius:12px;border:0;font-size:15px;font-weight:800;cursor:pointer}
  .wznav .bk{flex:0 0 90px;background:var(--card);color:var(--mut);border:1px solid var(--line)}
  .wznav .nx{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff}
  .reco{background:linear-gradient(180deg,rgba(124,92,255,.12),var(--card));border:1px solid #34306b;border-radius:var(--r);padding:15px;margin-bottom:11px;cursor:pointer;position:relative}
  .reco .why{color:#cdb8ff;font-size:13px;line-height:1.5;margin-top:8px;font-style:italic}
  .aisum{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:15px;font-size:14.5px;line-height:1.6;margin-bottom:8px}
  .aisum b{color:var(--acc2)}

  .nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(11,13,28,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));max-width:var(--maxw);margin:0 auto}
  .nav button{flex:1;background:none;border:0;color:var(--dim);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px}
  .nav button.on{color:var(--acc2)}
  .nav button.ai{color:#fff}
  .nav button.ai .ic{background:linear-gradient(90deg,var(--acc),var(--acc2));width:46px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;margin-top:-2px}
  .nav svg{width:22px;height:22px}
  .jump{position:fixed;right:16px;bottom:90px;z-index:60;background:var(--acc);color:#fff;border:0;border-radius:999px;padding:11px 16px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(124,92,255,.45);display:none;align-items:center;gap:6px}
  .toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:120;background:var(--card2);border:1px solid var(--acc);color:var(--txt);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
  .toast.on{opacity:1;bottom:114px}

  /* ===== Desktop / PC layout ===== */
  @media (min-width:900px){
    :root{ --maxw:1180px; }
    body{ padding-bottom:0; }
    .hrow{ padding:18px 0 12px; }
    .brand{ font-size:22px; }
    .clock{ font-size:14px; padding:8px 14px; }
    .search{ padding:13px 18px; }
    .search input{ font-size:16px; }
    /* card grid */
    #main{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 18px; align-items:start; padding-top:6px; }
    #main>.sec, #main>.aisum, #main>.askhero, #main>.actrow, #main>.empty, #main>#nowline{ grid-column:1 / -1; }
    .card,.reco{ margin-bottom:16px; }
    .card:hover,.reco:hover{ border-color:var(--acc); transform:translateY(-2px); }
    .askhero{ padding:26px 30px; }
    .askhero p{ max-width:62%; font-size:14px; }
    .chip{ cursor:pointer; }
    .chip:hover{ border-color:var(--acc); }
    /* footer nav -> centered floating bar */
    .nav{ left:50%; right:auto; transform:translateX(-50%); bottom:18px; max-width:560px; border:1px solid var(--line); border-radius:18px; padding:10px 8px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
    .nav button{ flex-direction:row; gap:8px; font-size:13px; padding:8px 14px; border-radius:12px; }
    .nav button:hover{ color:var(--txt); }
    .nav svg{ width:18px;height:18px; }
    .nav button.ai .ic{ width:34px;height:26px;margin:0; }
    main.wrap{ padding-bottom:120px; }
    /* sheets -> centered modal */
    .ov{ background:rgba(0,0,0,.7); }
    .sheet{ left:50%; right:auto; bottom:auto; top:50%; width:640px; max-width:92vw;
      max-height:84vh; border-radius:20px; border:1px solid var(--line);
      transform:translate(-50%,-44%) scale(.97); opacity:0;
      transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .2s; }
    .sheet.on{ transform:translate(-50%,-50%) scale(1); opacity:1; }
    .grip{ display:none; }
    .sbody{ padding:22px 26px 28px; }
    .fbtn button,.wznav button,.actrow button{ cursor:pointer; }
  }
  @media (min-width:1320px){
    #main{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  }
  .legal{ text-align:center; color:var(--dim); font-size:11.5px; padding:26px 12px 10px; line-height:1.6; }
  .legal a{ color:var(--mut); text-decoration:underline; cursor:pointer; }
  .privacy-body p{ color:var(--mut); font-size:13.5px; line-height:1.65; margin-bottom:11px; }
  .privacy-body b{ color:var(--txt); }
  .cbanner{ position:fixed; left:10px; right:10px; bottom:100px; z-index:90; background:var(--card2);
    border:1px solid var(--line); border-radius:14px; padding:13px 15px; display:none; gap:12px;
    align-items:center; font-size:12px; color:var(--mut); line-height:1.5; max-width:760px; margin:0 auto;
    box-shadow:0 10px 34px rgba(0,0,0,.5); }
  .cbanner.on{ display:flex; }
  .cbanner b{ color:var(--txt); }
  .cbanner a{ color:var(--acc2); text-decoration:underline; cursor:pointer; white-space:nowrap; }
  .cbanner button{ flex-shrink:0; background:linear-gradient(90deg,var(--acc),var(--acc2)); color:#fff;
    border:0; border-radius:10px; padding:10px 16px; font-weight:800; font-size:13px; cursor:pointer; }
  @media (min-width:900px){ .cbanner{ bottom:90px; } }
</style>
</head>
<body>

<div class="splash" id="splash"><div class="lg">AI <b>WEEK</b> 2026</div><div class="spin"></div></div>

<header>
  <div class="wrap">
    <div class="hrow">
      <div class="brand">AI <b>WEEK</b> Live</div>
      <div class="clock" id="clock">--:--</div>
    </div>
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="q" placeholder="Search by name: talk, speaker or company" autocomplete="off" />
      <span class="clr" id="qclr">clear</span>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<button class="jump" id="jump">Jump to now</button>
<div class="toast" id="toast"></div>

<nav class="nav">
  <button data-view="now" class="on" id="nvNow">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>NOW</button>
  <button data-view="all" id="nvAll">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>AGENDA</button>
  <button class="ai" id="nvAsk">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 3l1.8 4.5L18 9l-4.2 1.5L12 15l-1.8-4.5L6 9l4.2-1.5z"/><path d="M19 14l.9 2.2L22 17l-2.1.8L19 20l-.9-2.2L16 17l2.1-.8z"/></svg></span>ASK AI</button>
  <button data-view="plan" id="nvPlan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8L6.4 19.6l1-6L3 9.4l6-.9z"/></svg>MY PLAN</button>
</nav>

<div class="cbanner" id="cbanner">
  <div>This is an <b>unofficial, community made</b> helper for AI WEEK 2026. No accounts, no cookies, no tracking. Nothing you enter is stored on our servers. <a id="cbMore">Privacy and terms</a></div>
  <button id="cbOk">Got it</button>
</div>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div class="sbody" id="sbody"></div></div>

<script>
const TZ="Europe/Rome";
const API="/api/recommend";
let DATA=null, view="now", day=null, q="", fTag=new Set(), fRoom=new Set();
let favs=new Set(JSON.parse(localStorage.getItem("aiw_fav")||"[]"));
let reminders=new Set(JSON.parse(localStorage.getItem("aiw_rem")||"[]"));
let reco=JSON.parse(localStorage.getItem("aiw_reco")||"null");
const notified=new Set();
const $=s=>document.querySelector(s), el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const _qp=new URLSearchParams(location.search);
const _fakeISO=_qp.get("now");
const _fake=_fakeISO?new Date(_fakeISO):null;

function romeNow(){
  if(_fake) return new Date(_fake);
  return new Date(new Date().toLocaleString("en-US",{timeZone:TZ}));
}
function romeYMD(){ if(_fake) return _fakeISO.slice(0,10);
  return new Date().toLocaleDateString("en-CA",{timeZone:TZ}); }
function asLocal(iso){ return new Date(String(iso).replace(/Z$/,"")); }
function hm(iso){ return asLocal(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function initials(n){ return (n||"").split(/\s+/).map(w=>w[0]).filter(Boolean).slice(0,2).join("").toUpperCase(); }
function esc(s){ return (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
// Safety net: strip emojis and convert dashes so nothing reads AI-generated.
function clean(s){
  return (s||"")
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}️‍]/gu,"")
    .replace(/\s*[—–]\s*/g,", ")
    .replace(/ - /g,", ")
    .replace(/\s{2,}/g," ")
    .trim();
}
function spById(id){ return DATA._spById[id]; }
function sesById(id){ return DATA._seById[id]; }
function ph(n){ const d=el("div","ph"); d.textContent=initials(n); return d; }
function status(s){
  const now=romeNow(), st=asLocal(s.start), en=asLocal(s.end);
  if(now>=st&&now<en) return "live";
  const mins=(st-now)/60000;
  if(mins>0&&mins<=60) return "soon";
  if(now>=en) return "past";
  return "later";
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2600); }

function cardEl(s,opts={}){

  if(stt==="live"){ const b=el("div","badgep live ml");b.textContent="● LIVE";top.appendChild(b); }
  else if(stt==="soon"){ const m=Math.round((asLocal(s.start)-romeNow())/60000);

  if(s.speakerIds.length){

      const a=el("div","av");

      else a.appendChild(ph(p.name));

      a.appendChild(nm); sp.appendChild(a);

  }

    s.tags.slice(0,4).forEach(t=>{const g=el("span","tag");g.textContent=t;tg.appendChild(g);}); c.appendChild(tg); }
  if(favs.has(s.id)||reminders.has(s.id)){ const b=el("div","thm");b.style.background="var(--acc)";c.appendChild(b); }
  if(stt==="live"){
    const now=romeNow(),st=asLocal(s.start),en=asLocal(s.end);

    const pl=el("div","prog-l");pl.textContent=Math.round((en-now)/60000)+" min remaining";c.appendChild(pl);
  }
  return c;
}

function visible(){
  let r=DATA.sessions.filter(s=>s.start.slice(0,10)===day);
  if(fTag.size) r=r.filter(s=>(s.tags||[]).some(t=>fTag.has(t)));
  if(fRoom.size) r=r.filter(s=>fRoom.has(s.roomId));
  if(q){ const k=q.toLowerCase();
    r=r.filter(s=> s.title.toLowerCase().includes(k)
      || (s.desc||"").toLowerCase().includes(k)
      || (s.hook||"").toLowerCase().includes(k)
      || s.speakerIds.some(id=>{const p=spById(id);return p&&((p.name+" "+p.company+" "+p.title).toLowerCase().includes(k));}));
  }
  return r;
}

function groupByTime(arr,m){

/* ---- Calendar ---- */
function icsDate(iso){ // Rome local -> UTC stamp (CEST +02:00 in May)
  const d=new Date(String(iso).replace(/Z$/,"")+"+02:00");
  return d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
}
function buildICS(s){
  const sp=s.speakerIds.map(i=>{const p=spById(i);return p?p.name:"";}).filter(Boolean).join(", ");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//AI WEEK Live//EN","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:"+s.id+"@aiweek","DTSTAMP:"+icsDate(romeNow().toISOString()),
    "DTSTART:"+icsDate(s.start),"DTEND:"+icsDate(s.end),
    "SUMMARY:"+(s.title||"").replace(/[,;\\]/g,"\\$&"),
    "LOCATION:"+(s.room+", Milano Fiera Rho").replace(/[,;\\]/g,"\\$&"),
    "DESCRIPTION:"+((sp?"Speakers: "+sp+". ":"")+(s.hook||"")).replace(/[,;\\]/g,"\\$&").slice(0,300),
    "BEGIN:VALARM","TRIGGER:-PT15M","ACTION:DISPLAY","DESCRIPTION:Upcoming: "+(s.title||"").slice(0,60),"END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function downloadICS(s){
  const blob=new Blob([buildICS(s)],{type:"text/calendar"});
  const a=el("a");a.href=URL.createObjectURL(blob);a.download=(s.title||"session").slice(0,40).replace(/[^\w]+/g,"_")+".ics";
  document.body.appendChild(a);a.click();a.remove();
}
function gcalUrl(s){
  const f=i=>icsDate(i);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(s.title)+
    "&dates="+f(s.start)+"/"+f(s.end)+"&location="+encodeURIComponent(s.room+", Milano Fiera Rho")+
    "&details="+encodeURIComponent((s.hook||"")+"\n\nAI WEEK 2026");
}
function outlookUrl(s){
  const iso=i=>new Date(String(i).replace(/Z$/,"")+"+02:00").toISOString();
  return "https://outlook.office.com/calendar/0/deeplink/compose?subject="+encodeURIComponent(s.title)+
    "&startdt="+iso(s.start)+"&enddt="+iso(s.end)+"&location="+encodeURIComponent(s.room+", Milano Fiera Rho")+
    "&body="+encodeURIComponent((s.hook||"")+" AI WEEK 2026")+"&path=/calendar/action/compose";
}
function showCalendar(s){
  let h='<h3>Add to calendar</h3><p style="color:var(--mut);font-size:13.5px;margin:6px 0 18px;line-height:1.5">'+esc(s.title)+'<br>'+asLocal(s.start).toLocaleDateString("en-US",{weekday:"short",day:"numeric",month:"short"})+' · '+hm(s.start)+' to '+hm(s.end)+'. A 15 minute alert is included.</p>';
  h+='<div class="actrow" style="flex-direction:column">'+
     '<button class="cal" id="cG">Google Calendar</button>'+
     '<button id="cO">Outlook or Microsoft</button>'+
     '<button id="cA">Apple or .ics download</button></div>';
  showSheet(h);
  $("#cG").onclick=()=>window.open(gcalUrl(s),"_blank");
  $("#cO").onclick=()=>window.open(outlookUrl(s),"_blank");
  $("#cA").onclick=()=>{ downloadICS(s); toast("Calendar file downloaded. Open it to add to any calendar app."); };
}

  body+='<div class="step'+(i===3?" on":"")+'"><div class="wzq">Depth & days</div><div class="wzs">How deep, and which days you\'ll be at Milano Fiera Rho.</div><div class="fopt">'+LEVELS.map(l=>'<div class="o'+(WZ.level===l[0]?" on":"")+'" data-l="'+l[0]+'">'+l[1]+'</div>').join('')+'</div><div style="height:10px"></div><div class="fopt">'+DATA.days.map(d=>'<div class="o'+(WZ.days.includes(d)?" on":"")+'" data-d="'+d+'">'+new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",day:"numeric",month:"short"})+'</div>').join('')+'</div></div>';
  // step 4 notes
  body+='<div class="step'+(i===4?" on":"")+'"><div class="wzq">Anything else?</div><div class="wzs">Optional. Goals, what to avoid, who you want to meet. The more you give, the sharper the picks.</div><textarea id="wzN" rows="4" placeholder="e.g. Skip pure sales pitches. Most interested in production RAG, the EU AI Act, and meeting healthcare founders.">'+esc(WZ.notes)+'</textarea><div style="color:var(--dim);font-size:11.5px;margin-top:12px;line-height:1.55">When you continue, your answers are sent once to our AI provider to generate suggestions. They are <b style="color:var(--mut)">not stored</b> on our servers and no account is created. <a style="color:var(--acc2);text-decoration:underline;cursor:pointer" id="wzPriv">Privacy and terms</a></div></div>';
  body+='</div><div class="wznav">'+(i>0?'<button class="bk" id="wzB">Back</button>':'')+'<button class="nx" id="wzN2">'+(i===steps-1?"Get my plan":"Continue")+'</button></div>';
  showSheet(body,"");
  const sb=$("#sbody");
  sb.querySelectorAll('[data-r]').forEach(o=>o.onclick=()=>{WZ.role=o.dataset.r;sb.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle("on",x===o));});
  sb.querySelectorAll('[data-t]').forEach(o=>o.onclick=()=>{const t=o.dataset.t;WZ.interests.has(t)?WZ.interests.delete(t):WZ.interests.add(t);o.classList.toggle("on");});
  sb.querySelectorAll('[data-l]').forEach(o=>o.onclick=()=>{WZ.level=o.dataset.l;sb.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle("on",x===o));});
  sb.querySelectorAll('[data-d]').forEach(o=>o.onclick=()=>{const d=o.dataset.d;WZ.days.includes(d)?WZ.days=WZ.days.filter(x=>x!==d):WZ.days.push(d);o.classList.toggle("on");});
  if($("#wzPriv")) $("#wzPriv").onclick=openPrivacy;
  if($("#wzB")) $("#wzB").onclick=()=>{ saveStep(); WZ.step--; renderWizard(); };
  $("#wzN2").onclick=()=>{ saveStep();
    if(WZ.step<steps-1){ WZ.step++; renderWizard(); }
    else runAI();
  };
}
function saveStep(){ const p=$("#wzP"),n=$("#wzN"); if(p)WZ.profile=p.value.trim(); if(n)WZ.notes=n.value.trim(); }
function runAI(){
  const ans={ profile:WZ.profile, role:WZ.role, interests:[...WZ.interests],
    level:WZ.level, days:WZ.days.length?WZ.days:DATA.days, notes:WZ.notes };
  callAI(ans,"Building your personal AI WEEK route","Reading 530+ sessions, dropping anything that already ended, and matching to your profile.",()=>renderWizard());
}
function reAnalyze(){
  const ans=JSON.parse(localStorage.getItem("aiw_ans")||"null");
  if(!ans){ openWizard(); return; }
  callAI(ans,"Updating for the current time","Running your saved answers again so nothing recommended has already passed.",reAnalyze);
}
function quickAsk(query){
  query=(query||"").trim(); if(!query){ toast("Type what you're looking for first"); return; }
  const ans={ profile:query, role:"", interests:[], level:"any", days:DATA.days, notes:query };
  callAI(ans,"Searching with AI","Reading the full programme and finding upcoming talks that match your question.",()=>{ view="now"; render(); });
}
function callAI(ans,title,sub,retryFn){
  localStorage.setItem("aiw_ans",JSON.stringify(ans));
  showSheet('<div style="text-align:center;padding:46px 10px"><div class="spin" style="margin:0 auto 20px"></div><div style="font-weight:800;font-size:18px;margin-bottom:8px">'+esc(title)+'</div><div style="color:var(--mut);font-size:13.5px;line-height:1.6">'+esc(sub)+'</div><div style="color:var(--dim);font-size:12px;margin-top:14px">This can take 15 to 25 seconds while the AI reasons carefully.</div></div>');
  fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(Object.assign({},ans,{nowOverride:_fakeISO||""}))
  }).then(r=>r.json()).then(d=>{
    if(d.error){ showSheet('<h3>The AI is busy</h3><div class="sdesc">'+esc(d.error)+'</div><div class="fbtn"><button class="ok" id="rt">Try again</button></div>'); $("#rt").onclick=()=>retryFn(); return; }
    if(!d.picks||!d.picks.length){ showSheet('<h3>No upcoming matches</h3><div class="sdesc">'+esc(d.summary||"Everything matching may have ended for today. Try the other day or broaden your request.")+'</div><div class="fbtn"><button class="ok" id="rt">Adjust</button></div>'); $("#rt").onclick=()=>retryFn(); return; }
    reco={summary:d.summary,closing:d.closing,picks:d.picks,generatedAt:Date.now()};
    localStorage.setItem("aiw_reco",JSON.stringify(reco));
    closeSheet(); view="plan";
    document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.id==="nvPlan"));
    render(); window.scrollTo({top:0}); toast("Your AI picks are ready");
  }).catch(e=>{ showSheet('<h3>Connection problem</h3><div class="sdesc">Could not reach the AI service. Check your connection and try again.</div><div class="fbtn"><button class="ok" id="rt">Retry</button></div>'); $("#rt").onclick=()=>retryFn(); });
}

/* ---- privacy / legal / consent ---- */
function openPrivacy(){
  const h='<h3>Privacy and terms</h3><div class="privacy-body">'+
   '<p><b>What this is.</b> A free, community made helper for navigating AI WEEK 2026. It is not the official app and is not affiliated with, authorised by, or endorsed by AI WEEK or IA Spiegata Semplice. Session names, times and speaker details belong to the organisers and are shown for convenience only.</p>'+
   '<p><b>No account, no tracking.</b> There is no sign up and no login. We do not use cookies. We do not run analytics, advertising or third party trackers. We do not build a profile of you.</p>'+
   '<p><b>What stays on your device.</b> Your saved talks, reminders and AI results are stored only in your own browser (local storage) so the page remembers them. They never leave your device except as described next, and you can wipe them any time with "Clear my data" below.</p>'+
   '<p><b>When you use Ask AI.</b> The text you type in the form or the quick question, plus your selected topics, is sent one time to our AI provider (Cerebras, which runs the GLM model) purely to generate suggestions for you. We do not save that text on any server of ours, and no database receives it. We do not ask for your name, email or any identifying information, so please do not type personal data into the boxes.</p>'+
   '<p><b>Legal basis (EU/GDPR).</b> Processing happens only when you choose to press Ask AI, on the basis of your request and consent, and only to give you the answer you asked for. No personal data is required to use the app. As no account or contact detail is collected, requests are not linked to an identity.</p>'+
   '<p><b>Accuracy.</b> Times, rooms and speakers can change. Always confirm on the official AI WEEK channels before walking to a session. Suggestions are generated automatically and may be imperfect; use your own judgement.</p>'+
   '<p><b>No warranty.</b> The app is provided as is, without warranty of any kind, and the maker is not liable for any loss arising from its use or from any schedule change.</p>'+
   '<p><b>Contact.</b> Questions or a takedown request: reach the operator who shared this link.</p>'+
   '<p style="color:var(--dim);font-size:12px">Last updated 19 May 2026.</p>'+
   '</div><div class="fbtn"><button class="clr" id="pvClr">Clear my data</button><button class="ok" id="pvOk">Close</button></div>';
  showSheet(h,"");
  $("#pvOk").onclick=closeSheet;
  $("#pvClr").onclick=clearData;
}
function clearData(){
  ["aiw_fav","aiw_rem","aiw_reco","aiw_ans","aiw_consent"].forEach(k=>localStorage.removeItem(k));
  favs=new Set(); reminders=new Set(); reco=null;
  closeSheet(); view="now";
  document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.id==="nvNow"));
  render(); toast("All local data cleared from this device");
}
function initConsent(){
  const b=$("#cbanner");
  if(localStorage.getItem("aiw_consent")==="1"){ b.classList.remove("on"); return; }
  b.classList.add("on");
  $("#cbOk").onclick=()=>{ localStorage.setItem("aiw_consent","1"); b.classList.remove("on"); };
  $("#cbMore").onclick=openPrivacy;
}

/* ---- nav / search / clock / reminders ---- */
document.querySelectorAll(".nav button[data-view]").forEach(b=>b.onclick=()=>{
  view=b.dataset.view;
  document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x===b));
  render(); window.scrollTo({top:0});
});
$("#nvAsk").onclick=()=>openWizard();
$("#q").oninput=e=>{ q=e.target.value.trim(); $("#qclr").style.display=q?"block":"none";
  if(q&&(view==="now"||view==="plan")){view="all";document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.id==="nvAll"));}
  buildChips(); render(); };
$("#qclr").onclick=()=>{ q="";$("#q").value="";$("#qclr").style.display="none";buildChips();render(); };

function tickClock(){
  const n=romeNow(), c=$("#clock");
  c.textContent=n.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+" Milano";
  c.classList.toggle("live",isConfDay());
}
function checkReminders(){
  const now=romeNow();
  reminders.forEach(id=>{ const s=sesById(id); if(!s||notified.has(id))return;
    const mins=(asLocal(s.start)-now)/60000;
    if(mins>0&&mins<=10){ notified.add(id);
      const msg=s.title+" starts in "+Math.round(mins)+" min · "+s.room;
      if("Notification"in window&&Notification.permission==="granted")
        new Notification("AI WEEK reminder",{body:msg});
      else toast(msg);
    }
  });
}
const jump=$("#jump");
jump.onclick=()=>{ const t=$("#nowline")||document.querySelector(".sec"); t&&t.scrollIntoView({behavior:"smooth",block:"start"}); };
window.addEventListener("scroll",()=>{ jump.style.display=(view==="all"&&document.querySelector("#nowline"))?"flex":"none"; });

fetch("data/aiweek.json").then(r=>r.json()).then(d=>{
  DATA=d;
  DATA._spById={}; d.speakers.forEach(p=>DATA._spById[p.id]=p);
  DATA._seById={}; d.sessions.forEach(s=>DATA._seById[s.id]=s);
  if(!DATA.tagVocab) DATA.tagVocab=[];
  const today=romeYMD();
  day=d.days.includes(today)?today:d.days[0];
  $("#splash").remove();
  buildChips(); tickClock(); render(); initConsent();
  setInterval(()=>{ tickClock(); checkReminders(); if(view==="now")render(); },30000);
}).catch(e=>{ $("#splash").innerHTML='<div class="lg">Failed to load data</div><div style="color:var(--mut);font-size:13px;padding:0 20px;text-align:center">'+e+'</div>'; });
</script>
</body>
</html>
